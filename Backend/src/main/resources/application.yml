spring:
  application:
    name: Bus-Reservation-Backend-Dev-Nov24

  datasource:
    url: jdbc:postgresql://localhost:5432/demo
    username: postgres
    password: '1234'
    driver-class-name: org.postgresql.Driver


  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true


  liquibase:
    change-log: classpath:db/changelog/changelog-master.xml # Path to your master changelog file

springdoc:
  swagger-ui:
    path: /swagger-ui-custom.html
  api-docs:
    path: /api